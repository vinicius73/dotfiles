name: Validate

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: brew install shellcheck chezmoi fish mise
      - name: Validate shell scripts
        run: |
          sh -n script/bootstrap script/profile script/verify script/lib/dotfiles.sh script/lib/pokemonsay.sh script/libexec/pokemonsay-wrapper maintenance/clean-node-artifacts maintenance/clean-go-artifacts maintenance/clean-rust-artifacts maintenance/audit-js-vulnerabilities
          bash -n home/dot_bashrc scripts/*.sh
          shellcheck -s sh script/bootstrap script/profile script/verify script/lib/dotfiles.sh script/lib/pokemonsay.sh script/libexec/pokemonsay-wrapper maintenance/clean-node-artifacts maintenance/clean-go-artifacts maintenance/clean-rust-artifacts maintenance/audit-js-vulnerabilities
          fish --no-execute home/dot_config/fish/config.fish home/dot_config/fish/conf.d/git-extras.fish home/dot_config/fish/functions/dotfiles_greeting.fish
      - name: Run shell tests
        run: sh tests/run.sh
      - name: Validate Chezmoi source and shell startup output
        run: |
          temporary_home="$(mktemp -d)"
          chezmoi --source "$GITHUB_WORKSPACE/home" --destination "$temporary_home" apply
          chezmoi --source "$GITHUB_WORKSPACE/home" --destination "$temporary_home" verify
          HOME="$temporary_home" bash --login -ic 'test "$ANSIBLE_NOCOWS" = 1' 2>/dev/null
      - name: Validate mise configuration
        run: |
          temporary_config="$(mktemp -d)"
          MISE_CONFIG_DIR="$temporary_config" mise trust "$GITHUB_WORKSPACE/home/dot_config/mise/config.toml"
          MISE_CONFIG_DIR="$temporary_config" mise config ls --cd "$GITHUB_WORKSPACE/home/dot_config/mise"
      - name: Validate Brewfiles
        run: |
          ruby -c packages/macos/base.Brewfile
          ruby -c packages/macos/cli.Brewfile
          ruby -c packages/macos/desktop.Brewfile
          ruby -c packages/macos/docker.Brewfile
          ruby -c packages/macos/pokemonsay.Brewfile
